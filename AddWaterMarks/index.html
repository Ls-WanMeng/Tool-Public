<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量图片全屏水印 · Watermark Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary: #0f766e;
            --primary-strong: #0b5f59;
            --secondary: #2563eb;
            --secondary-strong: #1d4ed8;
            --accent: #ea580c;
            --accent-strong: #c2410c;
            --bg: #f0fdfa;
            --bg-pattern: rgba(15, 118, 110, 0.05);
            --surface: #ffffff;
            --surface-2: #f8faf9;
            --foreground: #134e4a;
            --muted: #e8f0f3;
            --muted-foreground: #5b6b6a;
            --border: #cfeae5;
            --border-strong: #a7d8d0;
            --destructive: #dc2626;
            --destructive-strong: #b91c1c;
            --ring: rgba(15, 118, 110, 0.35);
            --shadow-sm: 0 1px 2px rgba(15, 60, 55, 0.06), 0 1px 3px rgba(15, 60, 55, 0.04);
            --shadow-md: 0 8px 24px rgba(15, 60, 55, 0.08), 0 2px 6px rgba(15, 60, 55, 0.05);
            --shadow-lg: 0 20px 50px rgba(15, 60, 55, 0.14);
            --radius: 14px;
            --radius-sm: 9px;
            --t: 180ms cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Plus Jakarta Sans', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #2dd4bf;
                --primary-strong: #14b8a6;
                --secondary: #60a5fa;
                --secondary-strong: #3b82f6;
                --accent: #fb923c;
                --accent-strong: #f97316;
                --bg: #0b1413;
                --bg-pattern: rgba(45, 212, 191, 0.04);
                --surface: #14201f;
                --surface-2: #192827;
                --foreground: #e6f5f2;
                --muted: #20302e;
                --muted-foreground: #9db3b0;
                --border: #2a3b39;
                --border-strong: #3a514e;
                --destructive: #f87171;
                --destructive-strong: #ef4444;
                --ring: rgba(45, 212, 191, 0.35);
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
                --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
            }
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px 60px;
            color: var(--foreground);
            background-color: var(--bg);
            background-image: radial-gradient(var(--bg-pattern) 1px, transparent 1px);
            background-size: 22px 22px;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            background-color: var(--surface);
            padding: 34px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
        }

        /* ---------- Header ---------- */
        .app-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .brand-mark {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 6px 16px var(--ring);
        }
        .brand-mark svg { width: 26px; height: 26px; }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 4vw, 2.15rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted-foreground);
            font-size: 0.92rem;
        }

        .steps {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }
        .step {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted-foreground);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 999px;
        }
        .step b {
            display: inline-grid;
            place-items: center;
            width: 18px;
            height: 18px;
            font-size: 0.7rem;
            color: #fff;
            background: var(--primary);
            border-radius: 50%;
        }

        /* ---------- Upload ---------- */
        .upload-area {
            position: relative;
            border: 2px dashed var(--border-strong);
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 26px;
            border-radius: var(--radius);
            cursor: pointer;
            background: var(--surface-2);
            transition: border-color var(--t), background var(--t), transform var(--t), box-shadow var(--t);
        }
        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary);
            background: color-mix(in srgb, var(--primary) 7%, var(--surface-2));
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .upload-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 12px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 12%, transparent);
        }
        .upload-icon svg { width: 28px; height: 28px; }
        .upload-area p {
            margin: 0;
            font-weight: 600;
            font-size: 1rem;
        }
        .upload-area .hint {
            margin-top: 5px;
            font-size: 0.82rem;
            font-weight: 400;
            color: var(--muted-foreground);
        }
        #file-input { display: none; }

        /* ---------- Controls ---------- */
        .controls {
            margin: 0 0 10px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 820px) {
            .controls { grid-template-columns: 1fr 1fr; }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 20px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .control-group h3 {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 2px;
            font-size: 0.98rem;
            font-weight: 700;
        }
        .control-group h3 svg {
            width: 18px;
            height: 18px;
            color: var(--primary);
            flex: none;
        }

        .text-entries {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .text-entry { width: 100%; }
        .text-entry-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            width: 100%;
        }
        .text-entry input[type="text"] { flex: 1 1 140px; min-width: 110px; }
        .text-entry input[type="number"] { width: 66px; flex: none; }

        input[type="text"], input[type="number"], select {
            padding: 10px 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background-color: var(--surface);
            color: var(--foreground);
            font-family: inherit;
            font-size: 0.88rem;
            width: 100%;
            transition: border-color var(--t), box-shadow var(--t);
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--ring);
        }

        /* Sliders */
        .slider-container {
            display: grid;
            grid-template-columns: 92px 1fr 48px;
            align-items: center;
            gap: 12px;
            font-size: 0.86rem;
        }
        .slider-container label { color: var(--muted-foreground); font-weight: 500; }
        .slider-container span {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 0.8rem;
            text-align: right;
            color: var(--primary);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: var(--border-strong);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--surface);
            box-shadow: 0 1px 5px var(--ring);
            transition: transform var(--t);
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--surface);
            box-shadow: 0 1px 5px var(--ring);
            cursor: pointer;
        }

        /* Checkboxes */
        .check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.86rem;
            cursor: pointer;
            padding: 7px 9px;
            border-radius: 8px;
            transition: background var(--t);
        }
        .check-row:hover { background: color-mix(in srgb, var(--primary) 6%, transparent); }
        .check-row input {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            flex: none;
            border: 1.5px solid var(--border-strong);
            border-radius: 5px;
            background: var(--surface);
            cursor: pointer;
            position: relative;
            transition: background var(--t), border-color var(--t);
        }
        .check-row input:checked {
            background: var(--primary);
            border-color: var(--primary);
        }
        .check-row input:checked::after {
            content: '';
            position: absolute;
            left: 5px; top: 2px;
            width: 4px; height: 9px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .check-row input:focus-visible { box-shadow: 0 0 0 3px var(--ring); }

        /* Buttons */
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 14px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            transition: background var(--t), transform var(--t), box-shadow var(--t), border-color var(--t);
        }
        button svg { width: 17px; height: 17px; flex: none; }
        button:active:not(:disabled) { transform: scale(0.97); }
        button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary {
            color: #fff;
            background: var(--primary);
            box-shadow: 0 4px 12px var(--ring);
        }
        .btn-primary:hover:not(:disabled) { background: var(--primary-strong); transform: translateY(-1px); box-shadow: 0 6px 18px var(--ring); }

        .btn-secondary {
            color: var(--secondary);
            background: color-mix(in srgb, var(--secondary) 10%, var(--surface));
            border-color: color-mix(in srgb, var(--secondary) 25%, var(--border));
        }
        .btn-secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--secondary) 18%, var(--surface)); transform: translateY(-1px); }

        .btn-accent {
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.28);
        }
        .btn-accent:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(234, 88, 12, 0.36); }

        .btn-warning {
            color: #fff;
            background: var(--accent);
        }
        .btn-warning:hover:not(:disabled) { background: var(--accent-strong); transform: translateY(-1px); }

        .btn-danger {
            color: var(--destructive);
            background: color-mix(in srgb, var(--destructive) 10%, var(--surface));
            border-color: color-mix(in srgb, var(--destructive) 25%, var(--border));
        }
        .btn-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--destructive) 18%, var(--surface)); }
        .remove-text-btn {
            padding: 9px 11px;
            flex: none;
        }
        .remove-text-btn svg { width: 16px; height: 16px; }

        .actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        @media (min-width: 480px) {
            .actions { grid-template-columns: 1fr 1fr; }
        }

        /* ---------- Progress ---------- */
        .progress-container {
            width: 100%;
            height: 9px;
            background-color: var(--border);
            border-radius: 999px;
            margin: 22px 0;
            display: none;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 999px;
            width: 0%;
            transition: width 0.35s ease;
        }

        /* ---------- Preview ---------- */
        .preview-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 26px 0 12px;
        }
        .preview-head h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preview-head h3 svg { width: 19px; height: 19px; color: var(--primary); }
        .count-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 12%, transparent);
            border-radius: 999px;
            padding: 3px 10px;
        }

        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }
        .preview-empty {
            width: 100%;
            text-align: center;
            padding: 34px 16px;
            color: var(--muted-foreground);
            font-size: 0.86rem;
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-2);
        }
        .preview-empty svg { width: 34px; height: 34px; opacity: 0.5; margin-bottom: 8px; }

        .image-wrapper {
            position: relative;
            width: calc(50% - 6px);
            height: 0;
            padding-bottom: calc(50% - 6px);
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: zoom-in;
            background: var(--surface-2);
            transition: transform var(--t), box-shadow var(--t), border-color var(--t);
        }
        .image-wrapper:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }
        @media (min-width: 600px) {
            .image-wrapper { width: calc(33.333% - 8px); padding-bottom: calc(33.333% - 8px); }
        }
        @media (min-width: 900px) {
            .image-wrapper { width: calc(25% - 9px); padding-bottom: calc(25% - 9px); }
        }
        @media (min-width: 1200px) {
            .image-wrapper { width: calc(20% - 10px); padding-bottom: calc(20% - 10px); }
        }
        .image-wrapper img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .file-name {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.78));
            color: #fff;
            padding: 14px 8px 6px;
            font-size: 11px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .zoom-hint {
            position: absolute;
            top: 8px; right: 8px;
            width: 26px; height: 26px;
            display: grid; place-items: center;
            color: #fff;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 7px;
            opacity: 0;
            transition: opacity var(--t);
        }
        .zoom-hint svg { width: 14px; height: 14px; }
        .image-wrapper:hover .zoom-hint { opacity: 1; }

        /* ---------- Fullscreen ---------- */
        .fullscreen-preview {
            position: fixed;
            inset: 0;
            background-color: rgba(6, 18, 17, 0.92);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity var(--t);
            pointer-events: none;
        }
        .fullscreen-preview.active { opacity: 1; pointer-events: auto; }
        .fullscreen-image {
            max-width: 90%;
            max-height: 88%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
            transform: scale(0.96);
            transition: transform var(--t);
        }
        .fullscreen-preview.active .fullscreen-image { transform: scale(1); }
        .close-preview {
            position: absolute;
            top: 22px;
            right: 24px;
            width: 42px; height: 42px;
            padding: 0;
            font-size: 0;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }
        .close-preview svg { width: 20px; height: 20px; margin: auto; }
        .close-preview:hover { background: rgba(255, 255, 255, 0.22); }

        .app-footer {
            text-align: center;
            margin-top: 26px;
            font-size: 0.75rem;
            color: var(--muted-foreground);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6l-8-4Z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                </div>
                <h1>批量图片全屏水印</h1>
            </div>
            <p class="subtitle">为多张图片批量添加全屏防伪水印,保护你的创作版权</p>
            <div class="steps" aria-label="使用步骤">
                <span class="step"><b>1</b> 上传图片</span>
                <span class="step"><b>2</b> 设置水印</span>
                <span class="step"><b>3</b> 生成水印</span>
                <span class="step"><b>4</b> 打包下载</span>
            </div>
        </header>

        <div class="upload-area" id="drop-area" role="button" tabindex="0" aria-label="点击或拖拽图片到此处上传">
            <div class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <path d="M17 8l-5-5-5 5"/>
                    <path d="M12 3v12"/>
                </svg>
            </div>
            <p>点击或拖拽图片到此处上传</p>
            <p class="hint">支持 JPG、PNG 等常见格式,可一次选择多张</p>
            <input type="file" id="file-input" accept="image/*" multiple>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/><path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"/><path d="M8 12h8"/></svg>
                    水印文字设置
                </h3>
                <div class="text-entries" id="text-entries">
                    <div class="text-entry">
                        <div class="text-entry-controls">
                            <input type="text" placeholder="水印文字" class="watermark-text" value="版权保护">
                            <input type="number" placeholder="权重" min="1" value="1" class="watermark-weight" aria-label="权重">
                            <button class="btn-danger remove-text-btn" aria-label="删除该文字">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <button class="btn-warning" id="add-text-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    添加更多文字
                </button>
            </div>

            <div class="control-group">
                <h3>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>
                    水印样式设置
                </h3>
                <div class="slider-container">
                    <label for="opacity">透明度</label>
                    <input type="range" id="opacity" min="0.1" max="0.8" step="0.05" value="0.4">
                    <span id="opacity-value">40%</span>
                </div>

                <div class="slider-container">
                    <label for="density">密度</label>
                    <input type="range" id="density" min="1" max="15" step="1" value="8">
                    <span id="density-value">8</span>
                </div>

                <div class="slider-container">
                    <label for="complexity">复杂度</label>
                    <input type="range" id="complexity" min="1" max="5" step="1" value="4">
                    <span id="complexity-value">4</span>
                </div>

                <div class="slider-container">
                    <label for="noise-level">噪点强度</label>
                    <input type="range" id="noise-level" min="0" max="100" step="5" value="30">
                    <span id="noise-level-value">30%</span>
                </div>
            </div>

            <div class="control-group">
                <h3>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
                    高级防伪设置
                </h3>
                <label class="check-row"><input type="checkbox" id="enable-fingerprint" checked> 嵌入数字指纹</label>
                <label class="check-row"><input type="checkbox" id="enable-distortion" checked> 启用图像扭曲</label>
                <label class="check-row"><input type="checkbox" id="enable-dynamic-opacity" checked> 动态透明度</label>
                <label class="check-row"><input type="checkbox" id="enable-critical-area" checked> 重点区域保护</label>
            </div>

            <div class="control-group">
                <h3>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6v6H9z"/></svg>
                    操作
                </h3>
                <div class="actions">
                    <button class="btn-primary" id="add-watermark">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>
                        添加水印
                    </button>
                    <button class="btn-accent" id="download-all" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                        下载全部（ZIP）
                    </button>
                    <button class="btn-danger" id="clear-images">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                        清除所有图片
                    </button>
                    <button class="btn-secondary" id="save-config">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                        保存当前配置
                    </button>
                </div>
            </div>
        </div>

        <div class="progress-container" id="progress-container" role="progressbar" aria-label="处理进度">
            <div id="progress-bar"></div>
        </div>

        <div class="preview-head">
            <h3>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                图片预览
            </h3>
            <span class="count-badge" id="image-count">0 张</span>
        </div>
        <div class="preview-container" id="preview-container">
            <div class="preview-empty" id="preview-empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 8px" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                还没有图片,上传后这里会显示预览
            </div>
        </div>

        <p class="app-footer">Watermark Studio · 所有处理均在本地浏览器完成,图片不会上传至服务器</p>
    </div>

    <!-- 全屏预览 -->
    <div class="fullscreen-preview" id="fullscreen-preview">
        <button class="close-preview" id="close-preview" aria-label="关闭预览">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <img class="fullscreen-image" id="fullscreen-image" src="" alt="全屏预览">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        // 全局变量
        let originalImages = [];
        let watermarkedImages = [];

        // DOM元素
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const textEntriesContainer = document.getElementById('text-entries');
        const addTextBtn = document.getElementById('add-text-btn');
        const opacitySlider = document.getElementById('opacity');
        const opacityValue = document.getElementById('opacity-value');
        const densitySlider = document.getElementById('density');
        const densityValue = document.getElementById('density-value');
        const complexitySlider = document.getElementById('complexity');
        const complexityValue = document.getElementById('complexity-value');
        const noiseLevelSlider = document.getElementById('noise-level');
        const noiseLevelValue = document.getElementById('noise-level-value');
        const enableFingerprint = document.getElementById('enable-fingerprint');
        const enableDistortion = document.getElementById('enable-distortion');
        const enableDynamicOpacity = document.getElementById('enable-dynamic-opacity');
        const enableCriticalArea = document.getElementById('enable-critical-area');
        const addWatermarkBtn = document.getElementById('add-watermark');
        const downloadAllBtn = document.getElementById('download-all');
        const clearImagesBtn = document.getElementById('clear-images');
        const saveConfigBtn = document.getElementById('save-config');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const fullscreenPreview = document.getElementById('fullscreen-preview');
        const fullscreenImage = document.getElementById('fullscreen-image');
        const closePreviewBtn = document.getElementById('close-preview');

        // 初始化
        loadConfig();

        // 上传区键盘可访问
        dropArea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInput.click();
            }
        });

        // 事件监听器
        dropArea.addEventListener('click', () => fileInput.click());
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('dragover');
        });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleFiles(fileInput.files);
            }
        });

        opacitySlider.addEventListener('input', () => {
            opacityValue.textContent = `${Math.round(opacitySlider.value * 100)}%`;
        });

        densitySlider.addEventListener('input', () => {
            densityValue.textContent = densitySlider.value;
        });

        complexitySlider.addEventListener('input', () => {
            complexityValue.textContent = complexitySlider.value;
        });

        noiseLevelSlider.addEventListener('input', () => {
            noiseLevelValue.textContent = `${noiseLevelSlider.value}%`;
        });

        addTextBtn.addEventListener('click', () => {
            addTextEntry();
        });

        addWatermarkBtn.addEventListener('click', addWatermarkToAllImages);
        downloadAllBtn.addEventListener('click', downloadAllAsZip);
        clearImagesBtn.addEventListener('click', clearAllImages);
        saveConfigBtn.addEventListener('click', saveConfig);
        closePreviewBtn.addEventListener('click', closeFullscreenPreview);

        // 全屏预览：点击遮罩空白处或按 Esc 关闭
        fullscreenPreview.addEventListener('click', (e) => {
            if (e.target === fullscreenPreview) closeFullscreenPreview();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && fullscreenPreview.classList.contains('active')) {
                closeFullscreenPreview();
            }
        });

        // 更新图片计数
        function updateImageCount() {
            const badge = document.getElementById('image-count');
            if (badge) badge.textContent = `${originalImages.length} 张`;
            const empty = document.getElementById('preview-empty');
            if (empty) empty.style.display = originalImages.length === 0 ? '' : 'none';
        }

        // 添加文本输入行
        function addTextEntry(text = '', weight = 1) {
            const entry = document.createElement('div');
            entry.className = 'text-entry';
            entry.innerHTML = `
                <div class="text-entry-controls">
                    <input type="text" placeholder="水印文字" class="watermark-text" value="${text}">
                    <input type="number" placeholder="权重" min="1" value="${weight}" class="watermark-weight" aria-label="权重">
                    <button class="btn-danger remove-text-btn" aria-label="删除该文字">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                    </button>
                </div>
            `;
            textEntriesContainer.appendChild(entry);

            // 为新添加的删除按钮添加事件监听
            entry.querySelector('.remove-text-btn').addEventListener('click', () => {
                if (textEntriesContainer.querySelectorAll('.text-entry').length > 1) {
                    entry.remove();
                } else {
                    alert('至少需要保留一个水印文字');
                }
            });
        }

        // 处理上传的文件
        function handleFiles(files) {
            const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));

            if (imageFiles.length === 0) {
                alert('请上传图片文件');
                return;
            }

            imageFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        // 检查是否已存在同名图片
                        const existingIndex = originalImages.findIndex(img => img.file.name === file.name);

                        if (existingIndex >= 0) {
                            // 替换已存在的图片
                            originalImages[existingIndex] = {
                                file: file,
                                element: img,
                                url: e.target.result
                            };

                            // 更新预览
                            const wrapper = previewContainer.querySelectorAll('.image-wrapper')[existingIndex];
                            if (wrapper) {
                                wrapper.querySelector('img').src = e.target.result;
                                wrapper.querySelector('.file-name').textContent = getShortFileName(file.name);
                            }
                        } else {
                            // 添加新图片
                            originalImages.push({
                                file: file,
                                element: img,
                                url: e.target.result
                            });

                            // 创建预览
                            createPreviewImage(e.target.result, file.name);
                        }
                        updateImageCount();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 获取缩短的文件名
        function getShortFileName(name) {
            return name.length > 20 ? name.substring(0, 17) + '...' : name;
        }

        // 创建预览图片
        function createPreviewImage(src, fileName) {
            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';

            const previewImg = document.createElement('img');
            previewImg.src = src;
            previewImg.alt = fileName;
            previewImg.dataset.originalSrc = src; // 存储原始图片URL

            const zoomHint = document.createElement('div');
            zoomHint.className = 'zoom-hint';
            zoomHint.setAttribute('aria-hidden', 'true');
            zoomHint.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4M11 8v6M8 11h6"/></svg>';

            const fileNameDiv = document.createElement('div');
            fileNameDiv.className = 'file-name';
            fileNameDiv.textContent = getShortFileName(fileName);

            wrapper.appendChild(previewImg);
            wrapper.appendChild(zoomHint);
            wrapper.appendChild(fileNameDiv);
            previewContainer.appendChild(wrapper);

            // 添加点击事件
            wrapper.addEventListener('click', () => {
                // 优先显示已加水印的图片，如果没有则显示原始图片
                const watermarkedImg = watermarkedImages.find(img => img.file.name === fileName);
                showFullscreenPreview(watermarkedImg ? watermarkedImg.url : src);
            });
        }

        // 显示全屏预览
        function showFullscreenPreview(src) {
            fullscreenImage.src = src;
            fullscreenPreview.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭全屏预览
        function closeFullscreenPreview() {
            fullscreenPreview.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 获取所有水印文字和权重
        function getWatermarkTexts() {
            const entries = textEntriesContainer.querySelectorAll('.text-entry');
            const texts = [];
            const weights = [];

            entries.forEach(entry => {
                const textInput = entry.querySelector('.watermark-text');
                const weightInput = entry.querySelector('.watermark-weight');

                if (textInput.value.trim()) {
                    texts.push(textInput.value.trim());
                    weights.push(parseInt(weightInput.value) || 1);
                }
            });

            // 如果没有输入任何文字，使用默认值
            if (texts.length === 0) {
                texts.push('版权保护');
                weights.push(1);
            }

            return { texts, weights };
        }

        // 根据权重随机选择一个水印文字
        function getRandomWatermarkText(texts, weights) {
            const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
            let random = Math.random() * totalWeight;

            for (let i = 0; i < texts.length; i++) {
                if (random < weights[i]) {
                    return texts[i];
                }
                random -= weights[i];
            }

            return texts[0];
        }

        // 生成随机颜色
        function getRandomColor(opacity) {
            const types = [
                // 彩色
                () => `hsla(${Math.floor(Math.random() * 360)}, 80%, 50%, ${opacity})`,
                // 黑白
                () => {
                    const brightness = Math.random() > 0.5 ? '80%' : '20%';
                    return `hsla(0, 0%, ${brightness}, ${opacity})`;
                },
                // 半透明
                () => {
                    const r = Math.floor(Math.random() * 256);
                    const g = Math.floor(Math.random() * 256);
                    const b = Math.floor(Math.random() * 256);
                    return `rgba(${r}, ${g}, ${b}, ${opacity * 0.7})`;
                }
            ];

            return types[Math.floor(Math.random() * types.length)]();
        }

        // 生成多色文字（每个字符不同颜色）
        function getMultiColorText(text, opacity) {
            let html = '';
            for (let i = 0; i < text.length; i++) {
                const color = getRandomColor(opacity);
                html += `<span style="color:${color}">${text[i]}</span>`;
            }
            return html;
        }

        // 添加数字指纹
        function addDigitalFingerprint(ctx, width, height) {
            // 创建微小的、几乎不可见的标记
            const markerSize = Math.max(1, Math.min(width, height) / 500);
            const markerColor = `rgba(0, 0, 0, 0.01)`;

            // 在固定位置添加微小标记
            const positions = [
                {x: width * 0.1, y: height * 0.1},
                {x: width * 0.9, y: height * 0.1},
                {x: width * 0.1, y: height * 0.9},
                {x: width * 0.9, y: height * 0.9},
                {x: width * 0.5, y: height * 0.5}
            ];

            positions.forEach(pos => {
                ctx.fillStyle = markerColor;
                ctx.fillRect(pos.x, pos.y, markerSize, markerSize);
            });

            // 添加微小的颜色偏移
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // 在特定像素上添加微小变化
            for (let i = 0; i < data.length; i += 40) {
                if (i % 4 !== 3) { // 不改变alpha通道
                    data[i] = (data[i] + 1) % 256;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        // 添加图像扭曲
        function addImageDistortion(ctx, width, height, complexity) {
            const intensity = complexity * 0.2;
            const waveLength = width / (10 + complexity * 5);

            // 创建扭曲效果
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const newData = new Uint8ClampedArray(data.length);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    // 计算扭曲偏移
                    const offsetX = Math.sin(y / waveLength) * intensity * 2;
                    const offsetY = Math.cos(x / waveLength) * intensity;

                    const newX = Math.max(0, Math.min(width - 1, Math.floor(x + offsetX)));
                    const newY = Math.max(0, Math.min(height - 1, Math.floor(y + offsetY)));

                    // 复制像素
                    const origPos = (y * width + x) * 4;
                    const newPos = (newY * width + newX) * 4;

                    newData[origPos] = data[newPos];
                    newData[origPos + 1] = data[newPos + 1];
                    newData[origPos + 2] = data[newPos + 2];
                    newData[origPos + 3] = data[newPos + 3];
                }
            }

            // 应用扭曲
            const newImageData = new ImageData(newData, width, height);
            ctx.putImageData(newImageData, 0, 0);
        }

        // 添加重点区域保护
        function protectCriticalAreas(ctx, width, height, texts, opacity) {
            // 在图像中心区域添加更密集的水印
            const centerWidth = width * 0.6;
            const centerHeight = height * 0.6;
            const centerX = (width - centerWidth) / 2;
            const centerY = (height - centerHeight) / 2;

            // 增加中心区域的水印密度
            const centerDensity = 3;
            const cellWidth = centerWidth / (centerDensity * 2);
            const cellHeight = centerHeight / centerDensity;

            for (let i = 0; i < centerDensity * 2; i++) {
                for (let j = 0; j < centerDensity; j++) {
                    const x = centerX + i * cellWidth + cellWidth / 2;
                    const y = centerY + j * cellHeight + cellHeight / 2;

                    // 随机旋转角度
                    const angle = Math.random() * 360;

                    // 保存当前状态
                    ctx.save();

                    // 移动到水印位置并旋转
                    ctx.translate(x, y);
                    ctx.rotate(angle * Math.PI / 180);

                    // 绘制水印
                    const text = texts[Math.floor(Math.random() * texts.length)];
                    ctx.fillStyle = getRandomColor(opacity * 1.5); // 中心区域水印更明显
                    ctx.fillText(text, 0, 0);

                    // 恢复状态
                    ctx.restore();
                }
            }
        }

        // 添加水印到所有图片
        function addWatermarkToAllImages() {
            if (originalImages.length === 0) {
                alert('请先上传图片');
                return;
            }

            const { texts, weights } = getWatermarkTexts();
            const opacity = parseFloat(opacitySlider.value);
            const density = parseInt(densitySlider.value);
            const complexity = parseInt(complexitySlider.value);
            const noiseLevel = parseInt(noiseLevelSlider.value) / 100;

            watermarkedImages = [];
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            addWatermarkBtn.disabled = true;

            let processed = 0;

            originalImages.forEach((imgData, index) => {
                setTimeout(() => {
                    const watermarked = addWatermark(
                        imgData.element,
                        texts,
                        weights,
                        opacity,
                        density,
                        complexity,
                        noiseLevel
                    );

                    watermarkedImages.push({
                        file: imgData.file,
                        url: watermarked,
                        name: imgData.file.name.replace(/(\.[^/.]+)?$/, '_watermarked$&')
                    });

                    // 更新预览
                    const wrapper = previewContainer.querySelectorAll('.image-wrapper')[index];
                    if (wrapper) {
                        wrapper.querySelector('img').src = watermarked;
                    }

                    // 更新进度条
                    processed++;
                    const progress = (processed / originalImages.length) * 100;
                    progressBar.style.width = `${progress}%`;

                    if (processed === originalImages.length) {
                        addWatermarkBtn.disabled = false;
                        downloadAllBtn.disabled = false;
                    }
                }, 0);
            });
        }

        // 添加水印到单个图片
        function addWatermark(img, texts, weights, opacity, density, complexity, noiseLevel) {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');

            // 绘制原始图片
            ctx.drawImage(img, 0, 0);

            // 添加数字指纹
            if (enableFingerprint.checked) {
                addDigitalFingerprint(ctx, canvas.width, canvas.height);
            }

            // 添加图像扭曲
            if (enableDistortion.checked) {
                addImageDistortion(ctx, canvas.width, canvas.height, complexity);
            }

            // 设置水印样式
            const baseFontSize = Math.max(14, Math.min(img.width, img.height) / 20);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 计算水印分布
            const cols = density * 2;
            const rows = density;
            const cellWidth = img.width / cols;
            const cellHeight = img.height / rows;

            // 添加多种类型的水印
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const x = i * cellWidth + cellWidth / 2;
                    const y = j * cellHeight + cellHeight / 2;

                    // 随机旋转角度
                    const angle = Math.random() * 360;

                    // 动态透明度
                    const dynamicOpacity = enableDynamicOpacity.checked
                        ? opacity * (0.7 + Math.random() * 0.6) // 70%-130%的基础透明度
                        : opacity;

                    // 保存当前状态
                    ctx.save();

                    // 移动到水印位置并旋转
                    ctx.translate(x, y);
                    ctx.rotate(angle * Math.PI / 180);

                    // 根据复杂度决定水印类型数量
                    const typeCount = Math.min(7, 2 + complexity * 2);
                    const type = Math.floor(Math.random() * typeCount);

                    // 随机字体大小
                    const fontSize = baseFontSize * (0.7 + Math.random() * 0.6);
                    ctx.font = `${fontSize}px Arial`;

                    if (type === 0) {
                        // 文字水印 - 单色
                        ctx.fillStyle = getRandomColor(dynamicOpacity);
                        ctx.fillText(getRandomWatermarkText(texts, weights), 0, 0);
                    } else if (type === 1) {
                        // 文字水印 - 多色（每个字符不同颜色）
                        const text = getRandomWatermarkText(texts, weights);
                        let xOffset = -ctx.measureText(text).width / 2;

                        for (let k = 0; k < text.length; k++) {
                            ctx.fillStyle = getRandomColor(dynamicOpacity);
                            ctx.fillText(text[k], xOffset, 0);
                            xOffset += ctx.measureText(text[k]).width;
                        }
                    } else if (type === 2) {
                        // 圆形水印
                        ctx.beginPath();
                        const radius = cellWidth / (8 + Math.random() * 4);
                        ctx.arc(0, 0, radius, 0, Math.PI * 2);
                        ctx.fillStyle = getRandomColor(dynamicOpacity);
                        ctx.fill();
                    } else if (type === 3) {
                        // 线条水印
                        ctx.beginPath();
                        const length = cellWidth / (3 + Math.random() * 2);
                        ctx.moveTo(-length / 2, 0);
                        ctx.lineTo(length / 2, 0);
                        ctx.strokeStyle = getRandomColor(dynamicOpacity);
                        ctx.lineWidth = 1 + Math.random() * 3;
                        ctx.stroke();
                    } else if (type === 4) {
                        // 复杂形状水印
                        ctx.beginPath();
                        const size = cellWidth / (4 + Math.random() * 4);
                        const sides = 3 + Math.floor(Math.random() * 5); // 3-7边形

                        for (let k = 0; k < sides; k++) {
                            const angle = (k * 2 * Math.PI) / sides;
                            const x = size * Math.cos(angle);
                            const y = size * Math.sin(angle);
                            if (k === 0) {
                                ctx.moveTo(x, y);
                            } else {
                                ctx.lineTo(x, y);
                            }
                        }

                        ctx.closePath();
                        if (Math.random() > 0.5) {
                            ctx.fillStyle = getRandomColor(dynamicOpacity);
                            ctx.fill();
                        } else {
                            ctx.strokeStyle = getRandomColor(dynamicOpacity);
                            ctx.lineWidth = 1 + Math.random() * 2;
                            ctx.stroke();
                        }
                    } else if (type === 5) {
                        // 交叉线水印
                        ctx.beginPath();
                        const size = cellWidth / (3 + Math.random() * 2);
                        ctx.moveTo(-size/2, -size/2);
                        ctx.lineTo(size/2, size/2);
                        ctx.moveTo(size/2, -size/2);
                        ctx.lineTo(-size/2, size/2);
                        ctx.strokeStyle = getRandomColor(dynamicOpacity);
                        ctx.lineWidth = 1 + Math.random() * 2;
                        ctx.stroke();
                    } else {
                        // 随机点阵水印
                        const points = 5 + Math.floor(Math.random() * 10);
                        const pointSize = 1 + Math.random() * 3;

                        for (let k = 0; k < points; k++) {
                            const px = (Math.random() - 0.5) * cellWidth * 0.8;
                            const py = (Math.random() - 0.5) * cellHeight * 0.8;

                            ctx.beginPath();
                            ctx.arc(px, py, pointSize, 0, Math.PI * 2);
                            ctx.fillStyle = getRandomColor(dynamicOpacity);
                            ctx.fill();
                        }
                    }

                    // 恢复状态
                    ctx.restore();
                }
            }

            // 添加重点区域保护
            if (enableCriticalArea.checked) {
                protectCriticalAreas(ctx, canvas.width, canvas.height, texts, opacity);
            }

            // 添加额外的随机干扰点
            const dotCount = density * 15 * complexity;
            for (let i = 0; i < dotCount; i++) {
                const x = Math.random() * img.width;
                const y = Math.random() * img.height;
                const size = Math.random() * 3 + 1;

                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = getRandomColor(opacity * 0.7);
                ctx.fill();
            }

            // 添加随机线条干扰
            const lineCount = density * 3 * complexity;
            for (let i = 0; i < lineCount; i++) {
                const x1 = Math.random() * img.width;
                const y1 = Math.random() * img.height;
                const x2 = x1 + (Math.random() * 100 - 50);
                const y2 = y1 + (Math.random() * 100 - 50);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = getRandomColor(opacity * 0.5);
                ctx.lineWidth = 0.5 + Math.random() * 2;
                ctx.stroke();
            }

            // 添加噪点
            if (noiseLevel > 0) {
                const imageData = ctx.getImageData(0, 0, img.width, img.height);
                const data = imageData.data;

                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < noiseLevel) {
                        const noise = Math.floor(Math.random() * 40) - 20;
                        data[i] = Math.max(0, Math.min(255, data[i] + noise));     // R
                        data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise)); // G
                        data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise)); // B
                    }
                }

                ctx.putImageData(imageData, 0, 0);
            }

            // 添加半透明覆盖层（增加去除难度）
            if (complexity >= 4) {
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.05})`;
                ctx.fillRect(0, 0, img.width, img.height);
            }

            return canvas.toDataURL('image/jpeg', 0.9);
        }

        // 下载所有加水印的图片为ZIP压缩包
        function downloadAllAsZip() {
            if (watermarkedImages.length === 0) {
                alert('请先添加水印');
                return;
            }

            const zip = new JSZip();
            const imgFolder = zip.folder("!水印保护");

            // 添加所有图片到ZIP
            watermarkedImages.forEach(img => {
                const base64Data = img.url.replace(/^data:image\/(jpeg|png);base64,/, "");
                imgFolder.file(img.name, base64Data, { base64: true });
            });

            // 生成ZIP文件并下载
            zip.generateAsync({ type: "blob" })
                .then(content => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);

                    // 生成24小时制时分秒_年月日格式的时间戳
                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const seconds = String(now.getSeconds()).padStart(2, '0');
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const day = String(now.getDate()).padStart(2, '0');

                    const timestamp = `${hours}${minutes}${seconds}_${year}${month}${day}`;
                    link.download = `!水印保护_${timestamp}.zip`;

                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                });
        }

        // 清除所有图片
        function clearAllImages() {
            if (originalImages.length === 0) {
                alert('没有图片可清除');
                return;
            }

            if (confirm('确定要清除所有图片吗？')) {
                originalImages = [];
                watermarkedImages = [];
                previewContainer.innerHTML = '<div class="preview-empty" id="preview-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 8px" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>还没有图片,上传后这里会显示预览</div>';
                downloadAllBtn.disabled = true;
                updateImageCount();
            }
        }

        // 保存当前配置
        function saveConfig() {
            const config = {
                watermarkTexts: [],
                opacity: opacitySlider.value,
                density: densitySlider.value,
                complexity: complexitySlider.value,
                noiseLevel: noiseLevelSlider.value,
                enableFingerprint: enableFingerprint.checked,
                enableDistortion: enableDistortion.checked,
                enableDynamicOpacity: enableDynamicOpacity.checked,
                enableCriticalArea: enableCriticalArea.checked
            };

            document.querySelectorAll('.text-entry').forEach(entry => {
                const text = entry.querySelector('.watermark-text').value;
                const weight = entry.querySelector('.watermark-weight').value;
                config.watermarkTexts.push({ text, weight });
            });

            localStorage.setItem('watermarkConfig', JSON.stringify(config));
            alert('配置已保存！');
        }

        // 加载保存的配置
        function loadConfig() {
            const savedConfig = localStorage.getItem('watermarkConfig');
            if (savedConfig) {
                try {
                    const config = JSON.parse(savedConfig);

                    // 清除默认的文本输入行
                    textEntriesContainer.innerHTML = '';

                    // 添加保存的文本输入行
                    if (config.watermarkTexts && config.watermarkTexts.length > 0) {
                        config.watermarkTexts.forEach(item => {
                            addTextEntry(item.text, item.weight);
                        });
                    } else {
                        addTextEntry('版权保护', 1);
                    }

                    // 设置滑块值
                    if (config.opacity) {
                        opacitySlider.value = config.opacity;
                        opacityValue.textContent = `${Math.round(config.opacity * 100)}%`;
                    }

                    if (config.density) {
                        densitySlider.value = config.density;
                        densityValue.textContent = config.density;
                    }

                    if (config.complexity) {
                        complexitySlider.value = config.complexity;
                        complexityValue.textContent = config.complexity;
                    }

                    if (config.noiseLevel) {
                        noiseLevelSlider.value = config.noiseLevel;
                        noiseLevelValue.textContent = `${config.noiseLevel}%`;
                    }

                    // 设置复选框状态
                    if (config.enableFingerprint !== undefined) {
                        enableFingerprint.checked = config.enableFingerprint;
                    }
                    if (config.enableDistortion !== undefined) {
                        enableDistortion.checked = config.enableDistortion;
                    }
                    if (config.enableDynamicOpacity !== undefined) {
                        enableDynamicOpacity.checked = config.enableDynamicOpacity;
                    }
                    if (config.enableCriticalArea !== undefined) {
                        enableCriticalArea.checked = config.enableCriticalArea;
                    }
                } catch (e) {
                    console.error('加载配置失败:', e);
                }
            }
        }
    </script>
